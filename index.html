<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동래구청장 비서 · 공식문서 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F1E6;
    --paper: #FCFAF3;
    --ink: #221F1A;
    --ink-soft: #5B564C;
    --navy: #1F2C46;
    --navy-soft: #33425F;
    --seal: #A8382C;
    --seal-soft: #C65B4C;
    --line: #D8CDAF;
    --line-strong: #B8A97F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(184,169,127,0.18) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 24px 64px;
  }
  header.masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 18px;
    margin-bottom: 30px;
    gap: 20px;
    flex-wrap: wrap;
  }
  .masthead-left{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .emblem{
    width:52px;height:52px;flex-shrink:0;
  }
  .titles h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size: 26px;
    margin:0 0 4px;
    letter-spacing: -0.01em;
    color: var(--navy);
  }
  .titles p{
    margin:0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .masthead-right{
    font-family:'Noto Serif KR', serif;
    font-size: 13px;
    color: var(--ink-soft);
    text-align:right;
    line-height:1.6;
  }
  .layout{
    display:grid;
    grid-template-columns: 380px 1fr;
    gap: 28px;
    align-items:start;
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; }
  }
  .panel{
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--line-strong);
  }
  .form-panel{
    padding: 24px;
  }
  .form-panel h2{
    font-family:'Noto Serif KR', serif;
    font-size: 15px;
    margin: 0 0 18px;
    color: var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .form-panel h2::before{
    content:"";
    width:6px;height:6px;
    background: var(--seal);
    display:inline-block;
    border-radius: 50%;
  }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .doctype-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .doctype-btn{
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 9px 8px;
    font-size: 12.5px;
    font-family:'Noto Sans KR', sans-serif;
    cursor:pointer;
    text-align:left;
    transition: border-color .15s, background .15s;
    line-height:1.35;
  }
  .doctype-btn:hover{ border-color: var(--navy-soft); }
  .doctype-btn.active{
    background: var(--navy);
    border-color: var(--navy);
    color: #F6F1E6;
  }

    width:10
